services:
  - type: web
    name: nexora-realshop-bot
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DEFAULT_PREFIX
        value: "?"
      - key: BOT_NAME
        value: "Nexora"
      - key: GLOBAL_OWNER_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: PIX_KEY
        value: "5b38ac46-01c8-456e-9d7f-3d4c9eb1c294"
      - key: PIX_KEY_TYPE
        value: "ALEATORIA"
      - key: PIX_BENEFICIARY_NAME
        value: "DAVI DE S O DA SILVA"
      - key: PIX_BENEFICIARY_CITY
        value: "FORTALEZA"
